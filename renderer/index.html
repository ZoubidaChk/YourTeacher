<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>YourTeacher - Learn English Offline</title>
<style>
/* ============================================================
   YourTeacher - Design System
   Premium Duolingo/Adobe hybrid: rounded cards, vivid accents,
   clean typography, full dark/light support
   ============================================================ */
:root {
  --bg: #f7f8fa;
  --bg-panel: #ffffff;
  --bg-elevated: #ffffff;
  --text: #1d2129;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --primary: #58cc02;          /* Duolingo green */
  --primary-dark: #46a302;
  --primary-soft: rgba(88,204,2,0.12);
  --accent: #1cb0f6;           /* bright blue */
  --accent-soft: rgba(28,176,246,0.12);
  --danger: #ff4b4b;
  --danger-soft: rgba(255,75,75,0.12);
  --warning: #ffc800;
  --purple: #ce82ff;
  --purple-soft: rgba(206,130,255,0.12);
  --orange: #ff9600;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 8px rgba(16,24,40,0.06);
  --shadow-lg: 0 12px 40px rgba(16,24,40,0.12);
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --header-h: 64px;
  --sidebar-w: 250px;
}

[data-theme="dark"] {
  --bg: #0f1117;
  --bg-panel: #1a1d27;
  --bg-elevated: #232734;
  --text: #e8eaef;
  --text-muted: #9aa1b2;
  --border: #2d3242;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  transition: background 0.25s ease, color 0.25s ease;
  overflow: hidden;
}

/* ---------- App shell ---------- */
#app { display: flex; flex-direction: column; height: 100%; }

header.app-header {
  height: var(--header-h);
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 20px;
  box-shadow: var(--shadow);
  z-index: 10;
}

.logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 20px; letter-spacing: -0.5px;
}
.logo-badge {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: grid; place-items: center;
  color: #fff; font-size: 18px; font-weight: 800;
}

.header-stats {
  display: flex; gap: 16px; margin-left: auto; align-items: center;
}
.stat-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--border);
  font-weight: 700; font-size: 14px;
}
.stat-chip .ico { font-size: 16px; }
.xp-chip { color: var(--warning); border-color: rgba(255,200,0,0.4); }
.streak-chip { color: var(--orange); border-color: rgba(255,150,0,0.4); }
.level-chip { color: var(--accent); border-color: rgba(28,176,246,0.4); }

.theme-toggle {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 999px; width: 40px; height: 40px;
  cursor: pointer; font-size: 18px; display: grid; place-items: center;
  transition: transform 0.15s;
}
.theme-toggle:hover { transform: scale(1.08); }

.user-menu {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  padding: 5px 10px; border-radius: 999px;
}
.user-menu:hover { background: var(--bg); }
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--accent));
  color: #fff; display: grid; place-items: center;
  font-weight: 700; font-size: 15px;
}

/* ---------- Layout ---------- */
.main-layout { display: flex; flex: 1; overflow: hidden; }

nav.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  display: flex; flex-direction: column; gap: 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: var(--radius-sm);
  cursor: pointer; font-weight: 600; font-size: 15px;
  color: var(--text-muted); transition: all 0.15s;
  border: 2px solid transparent;
  -webkit-app-region: no-drag;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active {
  background: var(--primary-soft); color: var(--primary-dark);
  border-color: rgba(88,204,2,0.3);
}
[data-theme="dark"] .nav-item.active { color: var(--primary); }
.nav-item .ico { font-size: 20px; width: 26px; text-align: center; }
.nav-spacer { flex: 1; }
.nav-secondary { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }

section.content { flex: 1; overflow-y: auto; padding: 28px 34px; }
section.content::-webkit-scrollbar { width: 8px; }
section.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border-radius: var(--radius-sm);
  font-weight: 700; font-size: 15px; cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.1s, filter 0.15s;
  font-family: var(--font);
}
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary-dark); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-accent { background: var(--accent); color: #fff; border-color: #1899d6; }
.btn-accent:hover { filter: brightness(1.05); }
.btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
.btn-ghost:hover { color: var(--text); background: var(--bg); }
.btn-danger { background: var(--danger); color: #fff; border-color: #d43f3f; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-lg { padding: 16px 36px; font-size: 17px; }

/* ---------- Cards & generic ---------- */
.card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
}
h2.section-title { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 18px; }
h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.text-muted { color: var(--text-muted); }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}
.badge-green { background: var(--primary-soft); color: var(--primary-dark); }
[data-theme="dark"] .badge-green { color: var(--primary); }
.badge-blue { background: var(--accent-soft); color: #0b87c7; }
[data-theme="dark"] .badge-blue { color: var(--accent); }
.badge-purple { background: var(--purple-soft); color: #9d4edd; }

/* ---------- Onboarding ---------- */
.onboarding {
  max-width: 560px; margin: 60px auto; text-align: center;
}
.onboarding h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.6px; margin-bottom: 8px; }
.onboarding p { color: var(--text-muted); margin-bottom: 28px; font-size: 16px; }
.form-input {
  width: 100%; padding: 14px 18px; border-radius: var(--radius-sm);
  border: 2px solid var(--border); background: var(--bg-panel);
  color: var(--text); font-size: 15px; font-family: var(--font);
  margin-bottom: 16px; outline: none; transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--accent); }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0 26px; }
.level-option {
  padding: 16px 8px; border-radius: var(--radius-sm);
  border: 2px solid var(--border); background: var(--bg-panel);
  cursor: pointer; font-weight: 700; transition: all 0.15s;
}
.level-option .code { font-size: 20px; }
.level-option .lbl { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.level-option:hover { border-color: var(--accent); }
.level-option.selected { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- Dashboard ---------- */
.dash-hero {
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; margin-bottom: 26px;
}
.progress-card { position: relative; }
.circular-wrap { display: flex; align-items: center; gap: 26px; margin-top: 10px; }
.circular { position: relative; width: 160px; height: 160px; flex-shrink: 0; }
.circular svg { transform: rotate(-90deg); }
.circular .pct {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 30px; font-weight: 800;
}
.dash-info h2 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
.dash-info .sub { color: var(--text-muted); margin-bottom: 16px; }
.stat-row { display: flex; gap: 10px; flex-wrap: wrap; }
.mini-stat {
  flex: 1; min-width: 110px; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px; text-align: center;
}
.mini-stat .val { font-size: 24px; font-weight: 800; }
.mini-stat .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

.level-tabs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.level-tab {
  padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
  cursor: pointer; border: 2px solid var(--border); background: var(--bg-panel);
  color: var(--text-muted); transition: all 0.15s;
}
.level-tab:hover { border-color: var(--accent); color: var(--text); }
.level-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---------- Timeline / unit cards ---------- */
.unit-timeline { display: flex; gap: 18px; overflow-x: auto; padding: 8px 4px 16px; scroll-snap-type: x mandatory; }
.unit-timeline::-webkit-scrollbar { height: 8px; }
.unit-timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.unit-card {
  flex: 0 0 220px; scroll-snap-align: start;
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; cursor: pointer;
  transition: all 0.2s; position: relative; overflow: hidden;
  box-shadow: var(--shadow);
}
.unit-card:hover:not(.locked) { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
.unit-card .u-num {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; font-size: 17px;
  background: var(--primary-soft); color: var(--primary-dark); margin-bottom: 12px;
}
[data-theme="dark"] .unit-card .u-num { color: var(--primary); }
.unit-card .u-theme { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
.unit-card .u-grammar { font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-bottom: 14px; min-height: 34px; }
.unit-card .u-progress { font-size: 12px; font-weight: 700; color: var(--accent); }
.unit-card .u-bar { height: 6px; border-radius: 3px; background: var(--bg); margin-top: 8px; overflow: hidden; }
.unit-card .u-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.3s; }
.unit-card.locked {
  filter: blur(1.5px) grayscale(0.8); opacity: 0.55; cursor: not-allowed;
}
.unit-card.locked::after {
  content: '🔒'; position: absolute; top: 12px; right: 12px; font-size: 18px;
  filter: none;
}
.unit-card.completed .u-num { background: var(--primary); color: #fff; }

/* ---------- Lesson view ---------- */
.lesson-header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.breadcrumb { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.breadcrumb span { cursor: pointer; }
.breadcrumb span:hover { color: var(--accent); }

.lesson-body { display: grid; grid-template-columns: 1fr 300px; gap: 22px; align-items: start; }
@media (max-width: 980px) { .lesson-body { grid-template-columns: 1fr; } }
.reader {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow);
  font-size: 17px; line-height: 1.9;
}
.reader .hl {
  background: var(--warning); color: #5a4800;
  padding: 1px 6px; border-radius: 6px; font-weight: 700; cursor: pointer;
  border-bottom: 2px solid rgba(0,0,0,0.15);
}
[data-theme="dark"] .reader .hl { color: #ffd966; }
.vocab-side { display: flex; flex-direction: column; gap: 12px; }
.vocab-item {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 16px;
  cursor: pointer; transition: all 0.15s;
}
.vocab-item:hover { border-color: var(--accent); transform: translateX(3px); }
.vocab-item .w { font-weight: 800; color: var(--accent); }
.vocab-item .d { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

.listen-btn-row { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }

/* ---------- Quiz ---------- */
.quiz-container { max-width: 680px; margin: 0 auto; }
.quiz-progress { display: flex; gap: 6px; margin-bottom: 22px; }
.quiz-dot { flex: 1; height: 8px; border-radius: 4px; background: var(--border); }
.quiz-dot.done { background: var(--primary); }
.quiz-dot.current { background: var(--accent); }
.quiz-q { font-size: 21px; font-weight: 700; line-height: 1.5; margin-bottom: 22px; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.quiz-opt {
  padding: 14px 18px; border-radius: var(--radius-sm);
  border: 2px solid var(--border); background: var(--bg-panel);
  cursor: pointer; font-weight: 600; font-size: 15px;
  text-align: left; transition: all 0.15s; font-family: var(--font); color: var(--text);
}
.quiz-opt:hover { border-color: var(--accent); }
.quiz-opt.correct { border-color: var(--primary); background: var(--primary-soft); }
.quiz-opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.quiz-opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.quiz-opt:disabled { cursor: default; }
.quiz-feedback {
  padding: 14px 18px; border-radius: var(--radius-sm);
  font-weight: 700; margin-bottom: 16px; display: none;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: var(--primary-soft); color: var(--primary-dark); border: 1px solid rgba(88,204,2,0.4); }
[data-theme="dark"] .quiz-feedback.ok { color: var(--primary); }
.quiz-feedback.no { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(255,75,75,0.4); }

.result-card { text-align: center; padding: 40px; }
.result-score { font-size: 64px; font-weight: 800; margin: 10px 0; }
.result-msg { font-size: 17px; color: var(--text-muted); margin-bottom: 26px; }

/* ---------- Games ---------- */
.game-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.game-tab {
  padding: 10px 20px; border-radius: var(--radius-sm);
  border: 2px solid var(--border); background: var(--bg-panel);
  cursor: pointer; font-weight: 700; font-size: 14px; transition: all 0.15s;
  font-family: var(--font); color: var(--text);
}
.game-tab.active { border-color: var(--purple); background: var(--purple-soft); color: #9d4edd; }

/* Flip cards game */
.flip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 760px; }
.flip-card {
  aspect-ratio: 1.15; perspective: 600px; cursor: pointer;
}
.flip-card-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform 0.45s; transform-style: preserve-3d;
}
.flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
.flip-card.matched .flip-card-inner { transform: rotateY(180deg); }
.flip-card-front, .flip-card-back {
  position: absolute; inset: 0; border-radius: var(--radius-sm);
  display: grid; place-items: center; padding: 10px; text-align: center;
  backface-visibility: hidden; font-weight: 700; font-size: 14px;
  border: 2px solid var(--border);
}
.flip-card-front { background: var(--bg-panel); color: var(--accent); font-size: 22px; }
.flip-card-back { background: var(--purple); color: #fff; transform: rotateY(180deg); border-color: var(--purple); }
.flip-card.matched .flip-card-back { background: var(--primary); border-color: var(--primary); }

/* Sentence builder */
.sb-area { max-width: 720px; }
.sb-answer {
  min-height: 64px; border: 2px dashed var(--border); border-radius: var(--radius-sm);
  padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
  background: var(--bg); align-items: center;
}
.sb-word {
  padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px;
  background: var(--bg-panel); border: 2px solid var(--border);
  border-bottom-width: 4px; cursor: pointer; transition: all 0.1s;
  font-family: var(--font); color: var(--text);
}
.sb-word:hover { border-color: var(--accent); }
.sb-word:active { transform: translateY(2px); border-bottom-width: 2px; }
.sb-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.sb-word.placed { opacity: 0.35; pointer-events: none; }
.sb-timer { font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 12px; }
.sb-result { padding: 14px 18px; border-radius: var(--radius-sm); font-weight: 700; margin-top: 12px; display: none; }
.sb-result.show { display: block; }
.sb-result.ok { background: var(--primary-soft); color: var(--primary-dark); }
[data-theme="dark"] .sb-result.ok { color: var(--primary); }
.sb-result.no { background: var(--danger-soft); color: var(--danger); }

/* ---------- Listening game ---------- */
.listen-game { max-width: 640px; }
.listen-prompt {
  font-size: 24px; font-weight: 800; text-align: center; margin: 24px 0;
  min-height: 70px; display: grid; place-items: center;
}
.listen-input { width: 100%; }
.word-accuracy { margin-top: 16px; }
.word-chip {
  display: inline-block; padding: 4px 10px; border-radius: 6px;
  font-weight: 700; font-size: 14px; margin: 3px;
}
.word-chip.good { background: var(--primary-soft); color: var(--primary-dark); }
[data-theme="dark"] .word-chip.good { color: var(--primary); }
.word-chip.bad { background: var(--danger-soft); color: var(--danger); }

/* ---------- Speaking game ---------- */
.speak-game { max-width: 680px; }
.speak-target {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px; text-align: center;
  font-size: 22px; font-weight: 700; line-height: 1.6; margin-bottom: 18px;
}
.rec-btn {
  width: 74px; height: 74px; border-radius: 50%; border: none;
  background: var(--danger); color: #fff; font-size: 30px; cursor: pointer;
  box-shadow: 0 4px 20px rgba(255,75,75,0.4); transition: all 0.2s;
  display: grid; place-items: center; margin: 0 auto;
}
.rec-btn.recording { animation: pulse 1.2s infinite; background: #d43f3f; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,75,75,0.5); }
  50% { box-shadow: 0 0 0 18px rgba(255,75,75,0); }
}
.speak-status { text-align: center; margin-top: 14px; font-weight: 600; color: var(--text-muted); min-height: 24px; }
.accuracy-display {
  text-align: center; margin-top: 18px; padding: 22px;
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius); display: none;
}
.accuracy-display.show { display: block; }
.accuracy-pct { font-size: 48px; font-weight: 800; color: var(--primary-dark); }
[data-theme="dark"] .accuracy-pct { color: var(--primary); }
.accuracy-bar { height: 10px; border-radius: 5px; background: var(--bg); margin: 12px auto; max-width: 400px; overflow: hidden; }
.accuracy-bar-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--danger), var(--warning), var(--primary)); transition: width 0.5s; }
.transcript { color: var(--text-muted); font-size: 14px; margin-top: 8px; }

/* ---------- Writing Lab ---------- */
.writing-lab { max-width: 860px; }
.writing-prompt {
  background: var(--accent-soft); border: 1px solid rgba(28,176,246,0.3);
  border-radius: var(--radius-sm); padding: 16px 20px;
  font-weight: 700; margin-bottom: 16px; font-size: 16px;
}
.writing-area {
  width: 100%; min-height: 240px; padding: 18px;
  border-radius: var(--radius-sm); border: 2px solid var(--border);
  background: var(--bg-panel); color: var(--text);
  font-size: 16px; line-height: 1.8; font-family: var(--font);
  resize: vertical; outline: none;
}
.writing-area:focus { border-color: var(--accent); }
.writing-tools { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
.error-list { margin-top: 18px; }
.error-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--danger-soft); border: 1px solid rgba(255,75,75,0.25);
  margin-bottom: 8px; font-size: 14px;
}
.error-item .fix { font-weight: 800; }
.word-stats { display: flex; gap: 16px; margin-top: 14px; color: var(--text-muted); font-size: 13px; font-weight: 600; }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-panel); border-radius: var(--radius);
  padding: 28px; max-width: 460px; width: 90%; box-shadow: var(--shadow-lg);
}
.modal h3 { font-size: 19px; margin-bottom: 14px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120px);
  background: var(--text); color: var(--bg-panel);
  padding: 12px 24px; border-radius: 999px; font-weight: 700; font-size: 14px;
  box-shadow: var(--shadow-lg); transition: transform 0.3s ease; z-index: 200;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ---------- Utility ---------- */
.hidden { display: none !important; }
.center { display: grid; place-items: center; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.gap-12 { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <div class="logo-badge">Y</div>
      <span>YourTeacher</span>
    </div>
    <div class="header-stats" id="headerStats">
      <div class="stat-chip xp-chip"><span class="ico">⚡</span><span id="hdrXp">0 XP</span></div>
      <div class="stat-chip streak-chip"><span class="ico">🔥</span><span id="hdrStreak">0 day streak</span></div>
      <div class="stat-chip level-chip"><span class="ico">📚</span><span id="hdrLevel">A1</span></div>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>
    <div class="user-menu" id="userMenu">
      <div class="avatar" id="hdrAvatar">?</div>
      <span id="hdrName" style="font-weight:700;font-size:14px;"></span>
    </div>
  </header>

  <div class="main-layout">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="nav-item active" data-route="dashboard"><span class="ico">🏠</span>Dashboard</div>
      <div class="nav-item" data-route="learn"><span class="ico">📖</span>Learn</div>
      <div class="nav-item" data-route="writing"><span class="ico">✍️</span>Writing Lab</div>
      <div class="nav-item" data-route="listening"><span class="ico">🎧</span>Listening</div>
      <div class="nav-item" data-route="speaking"><span class="ico">🎤</span>Speaking</div>
      <div class="nav-secondary">
        <div class="nav-item" data-route="progress"><span class="ico">📊</span>Progress</div>
        <div class="nav-item" id="navExport"><span class="ico">💾</span>Export Report</div>
        <div class="nav-item" id="navSwitch"><span class="ico">👤</span>Switch User</div>
      </div>
      <div class="nav-spacer"></div>
    </nav>

    <!-- Content -->
    <section class="content" id="content">
      <!-- rendered by JS -->
    </section>
  </div>
</div>

<!-- Onboarding overlay -->
<div class="modal-overlay" id="onboardingOverlay">
  <div class="card onboarding">
    <h1>Welcome to YourTeacher</h1>
    <p>Your offline English coach for levels A1 to C1. Let's set up your profile.</p>
    <input class="form-input" id="obName" placeholder="What's your name?" maxlength="30">
    <p style="text-align:left;font-weight:700;font-size:14px;color:var(--text-muted);">Choose your starting level:</p>
    <div class="level-grid" id="obLevels"></div>
    <button class="btn btn-primary btn-lg" style="width:100%;" id="obStart">Start Learning</button>
  </div>
</div>

<!-- Generic modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<div id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
